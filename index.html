<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6b3a">
  <meta name="description" content="Diário de bordo de veículos e equipamentos.">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <title>Diário de Bordo Anglo</title>
</head>
<body>
  <main>
    <section id="loginView" class="panel login">
      <h1>Diário de Bordo</h1>
      <p class="muted">Entre enquanto estiver conectado. Depois, os registros podem ser preenchidos offline neste aparelho.</p>
      <label for="loginUser">Usuário</label>
      <input id="loginUser" autocomplete="username">
      <label for="loginPass">Senha</label>
      <input id="loginPass" type="password" autocomplete="current-password">
      <p id="loginMsg" class="message" aria-live="polite"></p>
      <button id="loginBtn" class="primary">Entrar</button>
    </section>

    <section id="appView" class="hidden">
      <header class="appHeader">
        <div>
          <h1>Diário de Bordo</h1>
          <div id="who" class="muted"></div>
        </div>
        <button id="installBtn" class="secondary hidden" type="button">Instalar app</button>
      </header>
      <div id="networkStatus" class="status" role="status"></div>
      <div class="toolbar">
        <button id="newBtn" class="primary">+ Nova saída</button>
        <button id="refreshBtn" class="secondary">Atualizar</button>
        <button id="printBtn" class="secondary">Imprimir planilha</button>
        <button id="logoutBtn" class="secondary">Sair</button>
      </div>
      <div class="filters">
        <select id="vehicleFilter" aria-label="Filtrar por veículo"></select>
        <input id="monthFilter" type="month" aria-label="Filtrar por mês">
      </div>
      <p id="appMsg" class="message" aria-live="polite"></p>
      <div id="records"></div>
    </section>

    <section id="printReport" aria-label="Relatório para impressão"></section>

    <section id="formView" class="panel hidden">
      <h1 id="formTitle">Nova saída</h1>
      <label for="inventoryCode">Código do inventário (opcional)</label>
      <input id="inventoryCode" autocomplete="off" autocapitalize="characters" placeholder="Ex.: EMF088">
      <label for="vehicle">Veículo</label>
      <input id="vehicle" list="vehicleOptions" autocomplete="off">
      <datalist id="vehicleOptions"></datalist>
      <label for="plate">Placa/Tag</label>
      <input id="plate" autocapitalize="characters">
      <label for="driver">Motorista</label>
      <input id="driver">
      <div class="grid">
        <div><label for="departure">Data/hora de saída</label><input id="departure" type="datetime-local"></div>
        <div><label for="meter">Tipo de medidor</label><select id="meter"><option value="KM">KM</option><option value="HR">HR (horímetro)</option></select></div>
      </div>
      <div class="grid">
        <div><label id="initialLabel" for="initialValue">KM inicial</label><input id="initialValue" type="number" step="any" inputmode="decimal"></div>
        <div><label for="arrival">Data/hora de chegada</label><input id="arrival" type="datetime-local"></div>
      </div>
      <div class="grid">
        <div><label id="finalLabel" for="finalValue">KM final</label><input id="finalValue" type="number" step="any" inputmode="decimal"></div>
        <div></div>
      </div>
      <div class="grid">
        <div><label for="origin">Origem</label><input id="origin"></div>
        <div><label for="destination">Destino</label><input id="destination"></div>
      </div>
      <label for="notes">Observações</label>
      <textarea id="notes" rows="2"></textarea>
      <label>Assinatura</label>
      <canvas id="signature" width="480" height="120" aria-label="Área para assinatura"></canvas>
      <div class="buttonRow"><button id="clearSignature" class="secondary" type="button">Limpar assinatura</button></div>
      <p id="formMsg" class="message" aria-live="polite"></p>
      <div class="buttonRow">
        <button id="cancelBtn" class="secondary" type="button">Cancelar</button>
        <button id="saveBtn" class="primary" type="button">Salvar</button>
      </div>
    </section>
    <footer id="appVersion" class="appVersion" aria-label="Versão do aplicativo"></footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
